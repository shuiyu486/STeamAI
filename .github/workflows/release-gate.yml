name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  product-checks:
    name: Product checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Pack tooling tests
        run: python -m unittest discover -s tests/pack_tooling -p "test_*.py"

      - name: Go vet
        run: go vet ./...

      - name: Product and contract tests
        run: go test -count=1 -p=2 -timeout=30m ./...

      - name: Check changed-file whitespace
        run: git diff --check HEAD^ HEAD
