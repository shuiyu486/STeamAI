name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Release inventory
        run: go run ./cmd/rekit -- -Command release-check -Format json

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

  windows-facade:
    name: Windows facade smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Release inventory
        shell: pwsh
        run: go run ./cmd/rekit -- -Command release-check -Format json

      - name: Doctor
        shell: pwsh
        run: .\rekit\rekit.ps1 -Command doctor

      - name: Facade smoke
        shell: pwsh
        run: .\rekit\tests\facade-smoke.ps1
