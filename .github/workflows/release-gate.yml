name: release-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-checks-linux:
    name: Go release checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Release inventory
        run: go run ./cmd/rekit -- -Command release-check -Format json

      - name: Status inventory
        run: go run ./cmd/rekit -- -Command status

      - name: Pack inventory
        run: go run ./cmd/rekit -- -Command packs

      - name: Skill contract
        run: go run ./cmd/skillcontractgen -repo . -check

      - name: Doctor
        run: go run ./cmd/rekit -- -Command doctor

      - name: Go vet
        run: go vet ./...

      - name: Go-native pack smoke matrix
        run: go test -count=1 -timeout=30m ./internal/rekit/cli -run '^TestRunGoSkeletonPackSmokeMatrix$'

      - name: Go tests
        run: go test -count=1 -p=2 -timeout=30m ./...

