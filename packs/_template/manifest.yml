schemaVersion: 2
name: _template
version: 0.3.0
description: Template skeleton for authoring declarative STeamAI security research packs
maturity: template

entrypoints:
  router: references/template/README.md
  team: references/template/agent-team.md
  workflow: references/template/workflow-template.md
  tooling: references/template/toolchain-router.md

references:
  - references/template/README.md
  - references/template/agent-team.md
  - references/template/workflow-template.md
  - references/template/toolchain-router.md

templates:
  - references/template/task-handoff.template.md

policies:
  - policies/README.md
  - ../../common/policies/agent-team.md
  - ../../common/policies/subagents.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml

teamHints:
  suggestedMembers: 1-2
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: dynamic-or-external-action
    title: Dynamic or external action
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/template/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
