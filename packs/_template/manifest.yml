schemaVersion: 2
name: _template
version: 0.2.0
description: Template skeleton for authoring declarative STeamAI security research packs
maturity: template

entrypoints:
  router: references/template/README.md
  workflow: references/template/workflow-template.md
  team: references/template/agent-team.md
  tooling: references/template/toolchain-router.md

references:
  - references/template/README.md
  - references/template/agent-team.md
  - references/template/workflow-template.md
  - references/template/toolchain-router.md

templates:
  - references/template/task-handoff.template.md

policies: []

tooling:
  catalog: tooling/catalog.yml
  references:
    - tooling/README.md

teamHints:
  executionMembers: 1-3
  reviewer: optional
  suggestedRoles:
    - focused-analysis
    - tooling-evaluation
  rules:
    - Commander creates durable members only for sustained independent work.
    - One owner and at most one verifier per question.
    - Reviewer reads artifact, evidence, and finding, then writes review only.

heavyActions:
  - id: dynamic-or-external-action
    risk: high
    requiredAuthorization: exact case-scoped user confirmation and Claude Code tool permission
    requiredContext: exact target, isolation, bounded runtime/output, rollback, stop conditions
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/template/*.md
  - tooling/catalog.yml
  - tooling/recipes/*.md

learningDenyPatterns:
  - 'C:\\'
  - 'artifacts[\\/]'
  - 'captures[\\/]'
  - '(?i)(api[_-]?key|token|secret|password|credential)\s*[:=]'
  - 'Task #[0-9]+'

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
