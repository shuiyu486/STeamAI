pack: _template
purpose: Template declarative tooling catalog

tools:
  - id: example-readonly-tool
    status: candidate
    purpose: Inspect one bounded case-local input and produce a bounded sidecar for review.
    inputs: [case-local regular file]
    outputs: [case-relative bounded sidecar]
    sideEffects: [filesystem-read, bounded-filesystem-write]
    requiresUserConfirmation: false
    stopConditions: [input-too-large, scope-drift, output-limit]
    reusableNotes:
      - Reading is bounded to the task scope; generated output remains case-local.
      - The catalog is capability metadata, never an executable command.

  - id: example-heavy-tool
    status: cautious
    purpose: Placeholder for a domain-specific action with execution or external side effects.
    sideEffects: [process-execution]
    requiresUserConfirmation: true
    requiredContext: [exact-target, isolation, budget, output-paths, rollback, stop-conditions]
    stopConditions: [timeout, scope-drift, unexpected-side-effect]
