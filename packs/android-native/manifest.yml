schemaVersion: 2
name: android-native
version: 1.0.0
description: 面向已授权 Android native、JNI、NDK 与本地库分析的声明式研究 pack。
maturity: declarative-vnext

entrypoints:
  router: references/android-native/README.md
  team: references/android-native/agent-team.md
  workflow: references/android-native/workflow-template.md
  tooling: references/android-native/toolchain-router.md

references:
  - references/android-native/README.md
  - references/android-native/agent-team.md
  - references/android-native/task-handoff.template.md
  - references/android-native/toolchain-router.md
  - references/android-native/workflow-template.md

templates:
  - references/android-native/task-handoff.template.md

policies:
  - policies/README.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/apk-native-triage.md
  - tooling/recipes/emulator-hook-review.md

teamHints:
  suggestedMembers: 1-2
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: device-connect
    title: 设备连接
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: emulator-run
    title: 模拟器执行
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: hook
    title: 动态 hook
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: network
    title: 网络访问
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: patch
    title: 应用或二进制修改
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: install
    title: 安装、卸载或重签名
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/android-native/README.md
  - references/android-native/workflow-template.md
  - references/android-native/toolchain-router.md
  - tooling/recipes/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
