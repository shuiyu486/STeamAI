schemaVersion: 1
name: android-native
version: 0.1.0
description: Authorized Android native and JNI analysis Agent Team pack skeleton
maturity: skeleton

managedFiles:
  - references/android-native/README.md
  - references/android-native/agent-team.md
  - references/android-native/workflow-template.md
  - references/android-native/toolchain-router.md

templateFiles:
  - references/android-native/task-handoff.template.md

localNeverOverwrite:
  - CLAUDE.local.md
  - references/android-native/task-handoff.md
  - tools.local.yml

managedBlock:
  file: CLAUDE.local.md
  blockId: android-native:router
  source: CLAUDE.local.snippet.md

syncPolicy:
  managedFiles: overwrite-with-backup
  templateFiles: create-if-missing
  localFiles: never-overwrite

workstreamDefaults:
  defaultAuthorityLane: main
  defaultStartLaneType: native-analysis
  handoffPath: references/android-native/task-handoff.md
  backupRoot: .rekit/backups/sync
  requestDefaultTargetLane: main

authorityFiles:
  - references/android-native/task-handoff.md

commonPolicies:
  - agent-team
  - tool-adapters
  - context-budget
  - subagents
  - lane-collaboration
  - review-first
  - write-boundaries
  - verification
  - evidence
  - tool-output
  - handoff

policyOverlays: []

subagentRoutes:
  - id: android-native:bounded-review
    taskTypes: finding-review,evidence-review,jni-review,hook-review,tooling-review
    trigger: fixed-boundary read-only review for Android native findings, JNI bridge notes, hook hypotheses, or tooling notes
    shardBasis: library-or-finding
    targetItemsPerAgent: 4
    maxParallel: 3
    reference: references/android-native/agent-team.md
    policyOverlay:
    subagentPermissions: read-only
    mainAgentOwns: ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,app_ref,library_ref,jni_symbol_ref,abi,component_ref,candidate_path,defer_reason
  - id: android-native:native-analysis
    taskTypes: native-analysis,jni-triage,apk-native-review,so-analysis,frida-hook-review,emulator-sidecar-review
    trigger: Android native workspace has app aliases, native libraries, JNI symbols, hook candidates, emulator summaries, or needs bounded analysis before main merge
    shardBasis: app-library-or-symbol
    targetItemsPerAgent: 2
    maxParallel: 2
    reference: references/android-native/agent-team.md
    policyOverlay:
    subagentPermissions: read-only-or-workspace-only
    mainAgentOwns: canonical-write,ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,app_ref,library_ref,jni_symbol_ref,abi,component_ref,hook_candidate_ref,candidate_path,defer_reason

promoteFiles:
  - references/android-native/README.md
  - references/android-native/agent-team.md
  - references/android-native/workflow-template.md
  - references/android-native/toolchain-router.md

toolingFiles:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/apk-native-triage.md
  - tooling/recipes/emulator-hook-review.md

promptFiles: []

laneTypes:
  - id: main
    title: Android native mainline
    authority: true
    workspaceRoot: workspace/main
    canWrite: references/android-native/task-handoff.md
    readOnly: .rekit/facts/**
    outputs: publication,decision,observation
  - id: native-analysis
    title: Android native / JNI analysis
    authority: false
    workspaceRoot: workspace/native
    canWrite: own-workspace
    readOnly: references/android-native/**,.rekit/facts/**
    outputs: observation,request,candidate,summary
  - id: tooling
    title: Tooling and adapter evaluation
    authority: false
    workspaceRoot: workspace/tooling
    canWrite: own-workspace
    readOnly: references/android-native/**,.rekit/facts/**
    outputs: observation,request,candidate,tooling-change

toolingCandidateSources:
  - references/android-native/toolchain-router.md

heavyToolGates:
  - id: full-trace
    title: Full trace capture
    sideEffects: full-trace,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: budget-exhausted,scope-drift,output-exceeds-bounded-evidence-packet
  - id: debug
    title: Dynamic debug or attach
    sideEffects: debug,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: timeout,unexpected-side-effect,scope-drift
  - id: inject
    title: Runtime injection or hook
    sideEffects: inject,filesystem-write
    defaultRisk: critical
    requiresConfirmation: true
    stopConditions: unexpected-mutation,scope-drift,budget-exhausted
  - id: patch
    title: Binary or project patch
    sideEffects: patch,filesystem-write
    defaultRisk: critical
    requiresConfirmation: true
    stopConditions: overwrite-risk,scope-drift,no-rollback-path
  - id: dump
    title: Memory or artifact dump
    sideEffects: dump,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: output-exceeds-bounded-evidence-packet,sensitive-artifact-detected,scope-drift
  - id: network
    title: Network access or replay
    sideEffects: network,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: live-target-ambiguity,unexpected-outbound-request,scope-drift
  - id: symex
    title: Long symbolic execution
    sideEffects: symex,filesystem-write
    defaultRisk: medium
    requiresConfirmation: true
    stopConditions: path-explosion,budget-exhausted,output-exceeds-bounded-evidence-packet

promoteDenyPatterns:
  - "C:\\"
  - "samples[\\/]"
  - "artifacts[\\/]"
  - "captures[\\/]"
  - "dumps?[\\/]"
  - "traces?[\\/]"
  - "evidence[\/]raw[\\/]"
  - "(^|[\\\\/])apks?[\\/]"
  - "(^|[\\\\/])devices?[\\/]"
  - "(^|[\\\\/])emulator[\\/]"
  - "patched[\\/]"
  - "[A-Za-z0-9_.-]*(sample|malware|payload|apk|aab|dex|odex|vdex|oat|so|pcap|capture|dump|trace|memory|patch|hook|frida)[A-Za-z0-9_.-]*\.(apk|aab|dex|odex|vdex|oat|so|jar|bin|dat|raw|dmp|mem|pcap|pcapng|zip|7z|rar|log|json|js)"
  - "(?i)sha256\s*[:=]\s*[0-9a-f]{64}"
  - "(?i)sha1\s*[:=]\s*[0-9a-f]{40}"
  - "(?i)md5\s*[:=]\s*[0-9a-f]{32}"
  - "(?i)(authorization|cookie|set-cookie)\s*[:=]"
  - "(?i)(api[_-]?key|token|secret|password|credential)\s*[:=]"
  - "(?i)bearer\s+[A-Za-z0-9._~+\/-]+"
  - "(?i)(android_id|device_id|imei|imsi|serial)\s*[:=]"
  - "\b(10|172\.(1[6-9]|2[0-9]|3[0-1])|192\.168)\."
  - "0x[0-9A-Fa-f]{6,}"
  - "ctx[0-9]+"
  - "round[0-9]+"
  - "Task #[0-9]+"

budgets:
  CLAUDE.local.md: 8192
  references/android-native/task-handoff.md: 12288
  defaultMarkdown: 16384
