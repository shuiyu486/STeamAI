# 复制为 tools.local.yml 后按本机环境修改；tools.local.yml 不应提交。
workspace:
  root: <workspaceRoot>
  kits: <workspaceRoot>\kits
  cases: <workspaceRoot>\cases
  tools: <workspaceRoot>\tools
  sharedArtifacts: <workspaceRoot>\shared-artifacts

ida:
  path: <idaRoot>\ida64.exe

x64dbg:
  path: <toolsRoot>\x64dbg\release\x64\x64dbg.exe
  mcpEndpoint: http://127.0.0.1:3000/mcp

scyllahide:
  injectorX64: <toolsRoot>\ScyllaHide\InjectorCLIx64.exe
  hookLibraryX64: <toolsRoot>\ScyllaHide\HookLibraryx64.dll
