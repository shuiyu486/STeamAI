schemaVersion: 2
name: binary-re
version: 1.0.0
description: 面向已授权二进制逆向、静态分析、受控动态验证与 VMProtect 研究的声明式研究 pack。
maturity: declarative-vnext

entrypoints:
  router: references/binary-re/README.md
  team: references/binary-re/general-agent-team.md
  workflow: references/binary-re/general-workflow.md
  tooling: references/binary-re/general-toolchain-router.md

references:
  - references/binary-re/README.md
  - references/binary-re/general-analysis.md
  - references/binary-re/general-workflow.md
  - references/binary-re/general-agent-team.md
  - references/binary-re/general-toolchain-router.md
  - references/binary-re/agent-driven-re.md
  - references/binary-re/workflow-template.md
  - references/binary-re/progressive-disclosure.md
  - references/binary-re/toolchain-router.md
  - references/binary-re/singleton-handler-review.md
  - references/binary-re/lane-collaboration.md

templates:
  - references/binary-re/task-handoff.template.md

policies:
  - policies/README.md
  - policies/subagents.overlay.md
  - policies/context-budget.overlay.md
  - policies/review-first.overlay.md
  - policies/verification.overlay.md
  - policies/lane-collaboration.overlay.md
  - ../../common/policies/agent-team.md
  - ../../common/policies/subagents.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/schemas/binary-inventory-v1.schema.json
  - tooling/recipes/static-binary-triage.md
  - tooling/recipes/function-behavior-review.md
  - tooling/recipes/public-tool-triage.md
  - tooling/recipes/focused-handler-review.md
  - tooling/recipes/value-flow-mining.md
  - tooling/recipes/vmenter-context-probe.md
  - tooling/recipes/unicorn-trace.md
  - tooling/recipes/ida-x64dbg-mcp.md
  - tooling/recipes/ida-agent-bridge-readonly.md
  - tooling/recipes/lane-collaboration.md

teamHints:
  suggestedMembers: 1-3
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: debug-or-trace
    title: 动态调试或 trace
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, output-limit, unexpected-side-effect]
  - id: inject-patch-or-dump
    title: 注入、patch 或 dump
    risk: critical
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, no-rollback-path, sensitive-output, unexpected-mutation]
  - id: network-or-external-service
    title: 网络或外部服务
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [target-ambiguity, budget-exhausted, rate-limit, scope-drift]

learningTargets:
  - references/binary-re/*.md
  - policies/*.md
  - tooling/recipes/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data
  - binary-addresses-or-hashes

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
