schemaVersion: 2
name: binary-re
version: 0.4.0
description: Authorized binary reverse engineering with passive analysis, bounded sidecar review, and review-first escalation
maturity: mature

entrypoints:
  router: references/binary-re/README.md
  workflow: references/binary-re/general-workflow.md
  team: references/binary-re/general-agent-team.md
  tooling: references/binary-re/general-toolchain-router.md

references:
  - references/binary-re/README.md
  - references/binary-re/general-analysis.md
  - references/binary-re/general-workflow.md
  - references/binary-re/general-agent-team.md
  - references/binary-re/general-toolchain-router.md
  - references/binary-re/agent-driven-re.md
  - references/binary-re/workflow-template.md
  - references/binary-re/progressive-disclosure.md
  - references/binary-re/toolchain-router.md
  - references/binary-re/singleton-handler-review.md
  - references/binary-re/lane-collaboration.md

templates:
  - references/binary-re/task-handoff.template.md

policies:
  registry: policies/manifest.yml
  overlays:
    - policies/subagents.overlay.md
    - policies/context-budget.overlay.md
    - policies/review-first.overlay.md
    - policies/verification.overlay.md
    - policies/lane-collaboration.overlay.md

tooling:
  catalog: tooling/catalog.yml
  schema:
    - tooling/schemas/binary-inventory-v1.schema.json
  recipes:
    - tooling/recipes/static-binary-triage.md
    - tooling/recipes/function-behavior-review.md
    - tooling/recipes/public-tool-triage.md
    - tooling/recipes/focused-handler-review.md
    - tooling/recipes/value-flow-mining.md
    - tooling/recipes/vmenter-context-probe.md
    - tooling/recipes/unicorn-trace.md
    - tooling/recipes/ida-x64dbg-mcp.md
    - tooling/recipes/ida-agent-bridge-readonly.md
    - tooling/recipes/lane-collaboration.md

teamHints:
  executionMembers: 1-3
  reviewer: recommended-for-important-findings
  suggestedRoles:
    - static-analysis
    - focused-feature-analysis
    - tooling-evaluation
  rules:
    - Commander creates durable members only for sustained independent work.
    - One owner and at most one verifier per binary, function, or finding.
    - Reviewer reads bounded evidence and finding, writes review only, and runs no heavy action.
    - Shared analysis databases and confirmed tables have one explicit writer.

heavyActions:
  - id: debug-or-trace
    risk: high
    requiredAuthorization: exact case-scoped user confirmation and Claude Code tool permission
    requiredContext: [exact-target, isolation, runtime-budget, output-limit, rollback, stop-conditions]
    stopConditions: [timeout, scope-drift, output-limit, unexpected-side-effect]
  - id: inject-patch-or-dump
    risk: critical
    requiredAuthorization: exact case-scoped user confirmation and Claude Code tool permission
    requiredContext: [exact-target, isolation, runtime-budget, output-limit, rollback, stop-conditions]
    stopConditions: [scope-drift, no-rollback-path, sensitive-output, unexpected-mutation]
  - id: network-or-external-service
    risk: high
    requiredAuthorization: exact case-scoped user confirmation and Claude Code tool permission
    requiredContext: [exact-target, network-policy, request-budget, output-limit, stop-conditions]
    stopConditions: [target-ambiguity, rate-limit, unexpected-outbound-request, scope-drift]

learningTargets:
  - references/binary-re/*.md
  - policies/*.md
  - tooling/catalog.yml
  - tooling/recipes/*.md

learningDenyPatterns:
  - 'C:\\'
  - 'samples[\\/]'
  - 'artifacts[\\/]'
  - 'captures[\\/]'
  - 'dumps?[\\/]'
  - 'traces?[\\/]'
  - '(?i)sha256\s*[:=]\s*[0-9a-f]{64}'
  - '(?i)(authorization|cookie|set-cookie)\s*[:=]'
  - '(?i)(api[_-]?key|token|secret|password|credential)\s*[:=]'
  - '0x[0-9A-Fa-f]{6,}'
  - 'Task #[0-9]+'

budgets:
  CLAUDE.local.md: 8192
  references/binary-re/task-handoff.md: 12288
  defaultMarkdown: 16384
