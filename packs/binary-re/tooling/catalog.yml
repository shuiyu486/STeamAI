schemaVersion: 1
pack: binary-re
purpose: General binary reverse engineering tooling with compiled static triage and bounded inspection of existing IDA TSV exports; VMProtect trace/devirtualization entries remain recipes or templates

paths:
  caseRoot: <caseRoot>
  toolsRoot: <toolsRoot>
  target: <target.exe>
  binaryRef: <binaryRef>
  functionRef: <functionRef>
  sidecar: <caseRoot>/evidence/sidecars

tools:
  - id: static-binary-triage-sidecar
    status: supported
    entry: compiled-in rekit-adapter-host child; catalog entry is provenance only and is never executed
    purpose: Build a bounded typed PE/ELF header, section, import, and export inventory without executing the target or writing analysis database state.
    sideEffects: filesystem-read,bounded-packet-write
    gateActions: inspect
    reusableNotes:
      - Emit tooling/schemas/binary-inventory-v1.schema.json through the fixed compiled-in adapter; do not invoke file, objdump, IDA, plugins, shell commands, or the target.
      - Store the typed inventory as a case-local sidecar and cite only bounded aliases or row ids in Markdown; never promote hashes, sample paths, raw binaries, dumps, traces, patches, or absolute paths.
      - The adapter revalidates the exact immutable dispatch and reads only bounded stable PE/ELF bytes; catalog entry text is never interpreted as a command.

  - id: function-behavior-review
    status: auxiliary
    entry: saved disassembly, decompiler, API, or behavior summary sidecar
    purpose: Review saved function/API behavior summaries without executing binaries, debugging, tracing, patching, renaming/commenting, or writing database state.
    sideEffects: none when reviewing saved summaries
    reusableNotes:
      - Sanitize hashes, IOCs, raw function bodies, symbol tables, trace paths, dump paths, patch bytes, rename/comment diffs, and customer identifiers before promoting any recipe.
      - Treat raw tool output and binary artifacts as case-local evidence, not pack content.

  - id: dynamic-debug-or-writeback-action
    status: cautious
    entry: <caseRoot>/tools/dynamic-debug-or-writeback-action
    purpose: Describe a bounded debug, trace, dump, patch, rename/comment, bulk decompile, database writeback, or networked verification step for authorized binary RE.
    sideEffects: process execution,debugger state,trace files,database writes,binary patches,filesystem writes,possible network events depending on isolation
    reusableNotes:
      - Execution requires exact target scope, isolation, network policy, runtime and output budgets, rollback notes, stop conditions, strict durable profile, and a fresh authorized gate.
      - The catalog is capability metadata; it is never interpreted as an executable command.

  - id: vmenter-trace-script
    status: mainline-template
    entry: <caseRoot>/trace_vmenter_seed.py
    purpose: VMEnter seed、dispatch trace、focused handler trace 的核心脚本模板。
    reusableNotes:
      - 参数化 target、rebuilt PE、context JSON、VMEnter RVA、dispatch limit。
      - 输出 trace CSV、summary、focused handler occurrence 数据。
      - 不把完整 trace 输出带入上下文，只保存到 captures 或机器可读文件。

  - id: vmenter-context-probe
    status: mainline-recipe
    entry: <caseRoot>/vmenter_context_probe*.dll or source/build recipe
    purpose: 在真实进程内捕获 VMEnter registers、stack、TEB/PEB/GS、heap/DLL memory ranges。
    reusableNotes:
      - 成品 DLL 通常不进模板；保留接口说明、字段 schema、build/attach recipe。
      - 优先 in-process probe，避免裸 debug_run 触发反调试。

  - id: suspended-launcher-injector
    status: auxiliary-template
    entry: <caseRoot>/launch_* or <caseRoot>/inject_*
    purpose: suspended 启动或注入 probe，捕获启动期 VMEnter。
    reusableNotes:
      - 参数化 target path、DLL path、output context path。
      - 记录权限要求和失败时的 stop condition。

  - id: unicorn-context-augmenter
    status: mainline-template
    entry: <caseRoot>/augment_context_memory.py
    purpose: 为 Unicorn 离线 trace 补 TEB/PEB/GS、DLL、heap 页。
    reusableNotes:
      - 输入 context JSON 与 memory map。
      - 输出 augmented context，供 trace script 使用。

  - id: value-flow-extractor
    status: mainline-template
    entry: <caseRoot>/extract_handler_value_flow.py
    purpose: 聚合 bytecode、old/new VSP、register writes、memory writes。
    reusableNotes:
      - 低样本、alias-heavy、early write overwritten 必须人工复核。

  - id: semantics-miner
    status: mainline-template
    entry: <caseRoot>/auto_mine_handler_semantics.py
    purpose: 批量挖掘 handler semantics、shape clustering、recommendation。
    reusableNotes:
      - 自动候选不能直接写 confirmed CSV；1-count/alias-heavy 必须 focused review。

  - id: routine-ir-builder
    status: mainline-template
    entry: <caseRoot>/build_routine_ir.py
    purpose: 合并 opcode/role confirmed CSV，输出 routine IR 与 coverage。
    reusableNotes:
      - confirmed opcode 与 bridge/control role 分表。

  - id: superinstruction-miner
    status: mainline-template
    entry: <caseRoot>/mine_routine_superinstructions.py
    purpose: 挖 repeated n-gram、shape motif、routine-level pattern。

  - id: ida-pro-idalib-mcp
    status: auxiliary
    entry: external IDA Pro / idalib MCP
    purpose: 静态 xref、函数精读、type/comment 辅助。
    reusableNotes:
      - 大范围查询交给子任务或片段化，不把完整 decompile/disasm 粘进上下文。

  - id: vmp-ida-index-inspector
    status: supported
    entry: compiled-in rekit-adapter-host child; catalog entry is provenance only and is never executed
    purpose: 对已有 function_index.tsv、strings.tsv、imports.tsv、xrefs.tsv 做 bounded literal 只读查询并生成 packet。
    sideEffects: filesystem-read,bounded-packet-write
    gateActions: inspect
    reusableNotes:
      - 只消费已有 export，不安装或启动 IDA，不打开 IDB，不联网。
      - query 仅支持 1～16 个 literal term，不支持 regex、glob 或 DSL。
      - adapter 由 rekit-adapter-host 固定分支执行，绝不解释执行本 catalog 的 entry。
      - rename/comment/patch/debug/dump 和全量导出均不属于此 candidate。

  - id: ida-agent-bridge
    status: candidate
    entry: external ida-agent-bridge / ida-bridge export directory
    purpose: headless IDA bridge；将 function index、strings、imports、decompile sidecar 和短连接查询暴露给 Agent。
    reusableNotes:
      - 适合 Agent 先读 function_index.tsv / strings.tsv / imports.tsv，再窄范围查询 pseudocode、xref、hexdump。
      - 默认不要求全量导出；需要批量索引时先确认导出成本。
      - 只定义外部 bridge contract；DPC-04 的 compiled-in 只读实现是 vmp-ida-index-inspector。
      - rename/comment/patch 会修改共享 IDB 状态，多 Agent 不并发写。
      - 不把完整 decompile/disasm 输出写入 Markdown，只记录摘要、packet 和 sidecar 路径。

  - id: x64dbg-mcp
    status: cautious
    entry: <toolsRoot>/x64dbg-mcp
    purpose: 必要动态交互与调试自动化。
    reusableNotes:
      - 反调试强样本避免裸 debug_run。
      - 必要时配合 ScyllaHide、管理员权限、attach 而非裸启动。

  - id: scyllahide
    status: auxiliary
    entry: <toolsRoot>/ScyllaHide
    purpose: 动态交互时降低反调试干扰。

  - id: vmp-import-fixers
    status: short-test-stoploss
    entry: <toolsRoot>/VMP-Imports-Deobfuscator, <toolsRoot>/VMPImportFixer, <toolsRoot>/vmpfix
    purpose: 公开 import fixer 短测。
    reusableNotes:
      - 设置 timeout、候选上限、日志静音。
      - 无 protected import 明确命中、候选爆炸、unresolved/missing export/emulation failed 即止损。

  - id: static-devirtualizers
    status: short-test-stoploss
    entry: <toolsRoot>/NoVmp, <toolsRoot>/VMPStatic, <toolsRoot>/minivmpfix
    purpose: 静态 devirtualizer 或 VMEnter 模板匹配短测。
    reusableNotes:
      - VMProtect 3.7+ on-the-fly/merged handler/rolling key 下旧模板经常不匹配。
      - 模板断言失败应快速转 trace-based pipeline。
