pack: binary-re
purpose: Declarative capability catalog for passive binary analysis and review-first escalation

tools:
  - id: static-binary-triage-sidecar
    status: mainline-template
    purpose: Build bounded PE/ELF header, section, import, and export summaries without executing the target.
    inputs: [authorized case-local binary alias]
    outputs: [case-local binary inventory sidecar]
    sideEffects: [filesystem-read, bounded-filesystem-write]
    requiresUserConfirmation: false
    stopConditions: [unsupported-format, input-too-large, output-limit, scope-drift]
    reusableNotes:
      - Use tooling/schemas/binary-inventory-v1.schema.json for the sidecar shape.
      - Raw binaries, hashes, paths, dumps, traces, patches, and absolute paths remain case-local.

  - id: function-behavior-review
    status: auxiliary
    purpose: Review saved disassembly, decompiler, API, or behavior summaries without execution or database writeback.
    inputs: [bounded saved summary, evidence refs]
    outputs: [evidence or finding review]
    sideEffects: []
    requiresUserConfirmation: false
    stopConditions: [raw-output-too-large, insufficient-evidence, scope-drift]

  - id: ida-sidecar-bounded-review
    status: mainline-template
    purpose: Query existing bounded IDA TSV indexes without opening IDA or modifying an IDB.
    inputs: [function_index.tsv, optional strings/imports/xrefs.tsv, literal terms]
    outputs: [case-local bounded packet]
    sideEffects: [filesystem-read, bounded-filesystem-write]
    requiresUserConfirmation: false
    stopConditions: [export-missing, input-too-large, output-limit, query-needs-full-export]

  - id: vmenter-trace-template
    status: cautious
    purpose: Capture or analyze VMEnter context and focused handler traces in an isolated authorized case.
    sideEffects: [process-execution, trace-files, bounded-filesystem-write]
    requiresUserConfirmation: true
    requiredContext: [exact-target, isolation, runtime-budget, output-limit, rollback, stop-conditions]
    stopConditions: [timeout, anti-debug-trigger, scope-drift, output-limit]

  - id: value-flow-extractor
    status: mainline-template
    purpose: Aggregate existing case-local bytecode, VSP, register, and memory-write sidecars.
    inputs: [bounded trace/value-flow sidecars]
    outputs: [case-local candidate semantics]
    sideEffects: [filesystem-read, bounded-filesystem-write]
    requiresUserConfirmation: false
    stopConditions: [low-sample, pointer-alias, inconsistent-source, output-limit]

  - id: ida-pro-idalib-mcp
    status: auxiliary
    purpose: Bounded static xref and function review when the user already provides an authorized IDA environment.
    sideEffects: [depends-on-request]
    requiresUserConfirmation: true
    requiredContext: [exact-database, allowed-operations, output-limit, stop-conditions]
    stopConditions: [shared-state-write, scope-drift, output-limit]

  - id: x64dbg-mcp
    status: cautious
    purpose: Bounded dynamic debugging in an isolated authorized environment.
    sideEffects: [process-execution, debugger-state, possible-filesystem-write]
    requiresUserConfirmation: true
    requiredContext: [exact-target, isolation, runtime-budget, output-limit, rollback, stop-conditions]
    stopConditions: [anti-debug-trigger, unexpected-mutation, scope-drift, timeout]

  - id: public-vmp-tool-short-test
    status: short-test-stoploss
    purpose: Determine whether a public import fixer or static devirtualizer produces an explicit bounded match.
    sideEffects: [process-execution, possible-filesystem-write]
    requiresUserConfirmation: true
    requiredContext: [exact-target, timeout, candidate-limit, output-limit, rollback]
    stopConditions: [no-explicit-match, candidate-explosion, assertion-failure, output-limit]
