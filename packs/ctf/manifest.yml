schemaVersion: 2
name: ctf
version: 1.0.0
description: 面向已授权 CTF、靶场、课程实验与本地 challenge 的声明式研究 pack。
maturity: declarative-vnext

entrypoints:
  router: references/ctf/README.md
  team: references/ctf/agent-team.md
  workflow: references/ctf/workflow-template.md
  tooling: references/ctf/toolchain-router.md

references:
  - references/ctf/README.md
  - references/ctf/agent-team.md
  - references/ctf/task-handoff.template.md
  - references/ctf/toolchain-router.md
  - references/ctf/workflow-template.md

templates:
  - references/ctf/task-handoff.template.md

policies:
  - policies/README.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/challenge-triage.md
  - tooling/recipes/local-repro-review.md

teamHints:
  suggestedMembers: 1-2
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: remote-connect
    title: 远程连接
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: fuzz
    title: 有界 fuzz
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: exploit-replay
    title: 利用复现
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: high-volume
    title: 高流量请求
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: debug
    title: 动态调试
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: patch
    title: 本地修改
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/ctf/README.md
  - references/ctf/workflow-template.md
  - references/ctf/toolchain-router.md
  - tooling/recipes/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
