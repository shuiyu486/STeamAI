schemaVersion: 2
pack: game-automation
mode: declarative

tools:
  - id: dm-window-automation
    status: candidate
    purpose: 用户选择大漠或已有大漠资产时，复用字库与窗口操作能力开发普通脚本或 C++/MFC 应用；与 Airtest 并存，不自动迁移旧脚本。
    inputs: [user-selected-sdk-version, version-matched-documentation, approved-window-binding, config-with-action-limits]
    outputs: [case-local-source-and-build-instructions, run-logs, step-observations]
    sideEffects: [process-execution, sdk-loading, input-injection-to-approved-target, bounded-filesystem-write]
    requiresUserConfirmation: true
    requiredContext: [sdk-and-process-bitness, version-matched-documentation, exact-target-binding, approved-input-mode, action-limits, stop-and-emergency-stop, output-limit]
    stopConditions: [version-mismatch, documentation-gap, target-missing, binding-invalid, input-mode-invalid, unexpected-dialog, low-confidence, budget-exhausted, stop-requested]
    reusableNotes:
      - 固定版本与资料查询见 tooling/integrations/dm.md；离线接口目录为 upstream/dm-7.2520/README.md，按需读页，不依赖外部插件；已有 7.2520 资产默认保留，不自动升级、安装或注册。
      - 后台需求不等于后台能力；exact 模式获准且识别/输入实测有效前，不允许失焦后继续或切换输入通道。
      - SDK、CHM、旧脚本、字库和凭据留在授权位置，不进入 pack；本条目不声明运行验收通过。

  - id: dm-document-update
    status: explicit-local-tool
    purpose: CHM 没有稳定的逐页导出/差异审查接口；显式提取并核对所选接口，复用未变的已审节选，拒绝将变更页自动当作已审。
    inputs: [exact-local-chm, sdk-version-label, reviewed-selection, new-output-directory]
    outputs: [page-change-report, new-document-snapshot, source-hashes]
    sideEffects: [temporary-chm-extraction, bounded-new-directory-write]
    requiresUserConfirmation: false
    requiredContext: [authorized-document-input, explicit-output-directory]
    stopConditions: [source-mismatch, unsafe-path, output-exists, pending-review, invalid-encoding]
    reusableNotes:
      - 入口 tooling/dm-docs-update.md；不执行帮助页代码，不加载 SDK，不覆盖已有资料或 case，不自动注册/升级。

  - id: airtest-desktop-automation
    status: candidate
    purpose: Windows 桌面游戏窗口的图像识别状态检查与有界键鼠输入，用于授权目标的自动化脚本。
    inputs: [approved-window-binding, config-with-action-limits]
    outputs: [run-logs, step-observations, failure-screenshots-case-local]
    sideEffects: [process-execution, input-injection-to-approved-target, bounded-filesystem-write]
    requiresUserConfirmation: true
    requiredContext: [exact-target-binding, action-limits, stop-and-emergency-stop, output-limit]
    stopConditions: [target-missing, window-unfocused, unexpected-dialog, low-confidence, budget-exhausted, stop-requested]
    reusableNotes:
      - 固定版本与运行接口见 tooling/integrations/airtest.md；环境预检通过并经用户批准后才实操。
      - 非幂等动作（提交/支付/领取）不进入自动重试路径。

  - id: poco-control-tree
    status: auxiliary
    purpose: 目标提供 SDK/控件树支持时的结构化状态读取与控件操作。
    inputs: [sdk-integration-verified, approved-window-binding]
    outputs: [control-tree-observations]
    sideEffects: [depends-on-target-sdk]
    requiresUserConfirmation: true
    requiredContext: [exact-target-binding, sdk-version, stop-conditions]
    stopConditions: [sdk-missing, version-mismatch, scope-drift]
    reusableNotes:
      - 仅当控件树实际可用时使用；无 SDK 时不承诺，图像识别兜底并声明不确定性。

  - id: state-decision-logic
    status: mainline-template
    purpose: 与执行框架解耦的状态决策：识别→校验前置→单步动作→等待预期→校验结果的纯逻辑层，可用 fake adapter 单测。
    inputs: [state-observation-or-fake, config-with-action-limits]
    outputs: [next-action-decision, log-records]
    sideEffects: []
    requiresUserConfirmation: false
    stopConditions: [unknown-state, retry-limit, config-invalid]
    reusableNotes:
      - 自动化决策逻辑（正常、失焦、超时、未知状态、停止、恢复）默认用 fake adapter 覆盖单测；真实框架不在默认单测启动。

  - id: reference-diff-workbench
    status: candidate
    purpose: 自动化脚本改后回归：同一场景的参照/候选两份观察按外部证据（应用状态/绑定/画面/识别/输入/后置状态）比首差，给出可区分故障的下一步与修后复验；缺证据即未知，不把函数成功当达到目标。
    inputs: [scenario-steps, reference-observation, candidate-variant, plan-declarations, caller-provided-exe-sha256]
    outputs: [observation-traces, first-difference-report, matrix-summary]
    sideEffects: [own-demo-target-process, input-posted-to-own-child-window-offscreen, bounded-filesystem-write]
    requiresUserConfirmation: false
    requiredContext: [exact-scenario, output-path, step-expectations, caller-provided-exe-sha256]
    stopConditions: [exe-hash-mismatch, unsafe-plan-id, output-exists, target-foreground, target-on-screen, capture-unreadable, stop-requested]
    reusableNotes:
      - 入口 tooling/examples/windows-flow/workbench.py（run/observe/compare/matrix）与 refdiff.py；只启动按调用者独立给出的 SHA-256 核对过的自建 dm_demo_target，只操作其子进程窗口（显示到所有显示器之外）；不截屏、不 SendInput、不装钩子、不调用模型、不操作其它窗口。
      - matrix 退出码 0 只表示每项实际结果符合 plan 声明，不是工作流成功；compare 的 0 要求两份都确有目标达成且声明的保留项无冲突，同一份坏轨迹自比不绿。
      - 真实游戏/第三方窗口未验收；隐藏窗口读不到像素记 unknown；不是通用执行器，场景与 plan 由调用者给出。

entries:
  - id: windows-stateful-automation
    recipe: tooling/recipes/windows-stateful-automation.md
    purpose: Windows 桌面目标上有状态自动化的实现方法（状态枚举、识别通道、有界等待、非幂等保护）。
    inputs: [approved-window-binding, state-sequence, action-and-wait-limits, non-idempotent-list]
    outputs: [run-logs, input-timeline, ledger, bounded-failure-screenshots]
    risk: review-before-use
  - id: automation-regression
    recipe: tooling/recipes/automation-regression.md
    purpose: 自动化脚本验收与改后回归的六场景矩阵（正常/延迟/错误/暂停恢复/停止/重复启动）。
    inputs: [script-under-test, synthetic-or-approved-target, scenario-configs]
    outputs: [scenario-results, stop-latency-measurement, regression-record]
    risk: review-before-use

examples:
  - id: dm-cpp-mfc-starter
    path: tooling/examples/dm-cpp-mfc/
    purpose: 脱离按键精灵的 C++/MFC 基础工程；界面控制/日志、同位数 worker、自建目标窗口 demo、合成测试与构建部署说明。
    reusableNotes:
      - 默认演示不加载 SDK；版本查询与窗口测试分别确认。窗口测试先 Reg 成功，再绑定自建目标；许可仅走私有管道，不含游戏业务或任意方法调用协议。
      - MFC 按钮到真实 SDK 的自建窗口链路已通过；合成测试不替代真实 SDK、可见外观或游戏验收，准确范围见工程 README。

  - id: windows-flow-reference
    path: tooling/examples/windows-flow/
    purpose: 决策核心与执行框架解耦的参考骨架（State/DecisionCore/FakeDevice/Runner、控制文件、ledger、时间线）；--selftest 无需第三方依赖。
    reusableNotes:
      - 此 Python/Airtest 示例接真实目标时实现 AirtestDevice，决策核心不改；不绑定真实窗口，也不要求大漠 C++/MFC 项目采用此工程。

integrations:
  - id: dm-window-automation
    integration: tooling/integrations/dm.md
    purpose: 大漠版本与资料核对、已有资产复用及 C++/MFC 工程接入；不内置 SDK、不自动执行。
    inputs: [user-selected-sdk-version, version-matched-documentation, approved-window-binding, config-with-action-limits]
    outputs: [case-local-source-and-build-instructions, run-logs, step-observations]
    risk: specific-confirmation-before-sdk-loading-or-input
    stopConditions: [version-mismatch, documentation-gap, target-missing, binding-invalid, input-mode-invalid, unexpected-dialog, low-confidence, budget-exhausted]

  - id: airtest-desktop-automation
    integration: tooling/integrations/airtest.md
    purpose: 固定版本 Airtest 的 Windows 桌面窗口状态识别与有界输入。
    inputs: [approved-window-binding, config-with-action-limits]
    outputs: [run-logs, step-observations, failure-screenshots-case-local]
    risk: six-item-qualification-then-specific-confirmation
    stopConditions: [target-missing, window-unfocused, unexpected-dialog, low-confidence, budget-exhausted]

schemas: []
constraints:
  - No entry executes automatically.
  - Input injection and non-idempotent actions require exact target binding, specific user confirmation, and tool permission.
  - Stop on target missing, unexpected dialog, low confidence, budget exhaustion, or user stop request; after stop no new input until re-observation.
