schemaVersion: 1
pack: generic-binary-re
purpose: Generic binary reverse engineering tooling catalog

paths:
  caseRoot: <caseRoot>
  toolsRoot: <toolsRoot>
  binaryRef: <binaryRef>
  functionRef: <functionRef>
  sidecar: <caseRoot>/evidence/sidecars

tools:
  - id: static-binary-triage-sidecar
    status: mainline-template
    entry: case-local binary metadata / section / import / string / symbol summary
    purpose: Build binary inventory and function/API behavior hypotheses without executing samples or writing analysis database state.
    sideEffects: none
    reusableNotes:
      - Store headers, sections, imports/exports, symbols, strings, file format notes, and initial function group hypotheses as case-local sidecar, then cite only summaries in Markdown.
      - Use binary/function aliases or sidecar row ids instead of hashes, sample paths, raw function bodies, dumps, traces, patches, or absolute paths in pack-promotable notes.
  - id: function-behavior-review
    status: auxiliary
    entry: saved disassembly, decompiler, API, or behavior summary sidecar
    purpose: Review saved function/API behavior summaries without executing binaries, debugging, tracing, patching, renaming/commenting, or writing database state.
    sideEffects: none when reviewing saved summaries
    reusableNotes:
      - Sanitize hashes, IOCs, raw function bodies, symbol tables, trace paths, dump paths, patch bytes, rename/comment diffs, and customer identifiers before promoting any recipe.
      - Treat raw tool output and binary artifacts as case-local evidence, not pack content.
  - id: dynamic-debug-or-writeback-action
    status: cautious
    entry: <caseRoot>/tools/dynamic-debug-or-writeback-action
    purpose: Execute a bounded debug, trace, dump, patch, rename/comment, bulk decompile, database writeback, or networked verification step for authorized generic binary RE.
    sideEffects: process execution, debugger state, trace files, database writes, binary patches, filesystem writes, possible network events depending on isolation
    reusableNotes:
      - Requires explicit binary/function scope, isolation, network policy, runtime budget, output size limit, rollback notes, and stop conditions before use.
      - Never store raw binaries, hashes, dumps, traces, patch bytes, function bodies, symbol tables, IOCs, customer context, or absolute paths in pack docs.
