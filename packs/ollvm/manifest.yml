schemaVersion: 2
name: ollvm
version: 1.0.0
description: 面向已授权 OLLVM、native obfuscation 与 deobfuscation candidate review 的声明式研究 pack。
maturity: declarative-vnext

entrypoints:
  router: references/ollvm/README.md
  team: references/ollvm/agent-team.md
  workflow: references/ollvm/workflow-template.md
  tooling: references/ollvm/toolchain-router.md

references:
  - references/ollvm/README.md
  - references/ollvm/agent-team.md
  - references/ollvm/task-handoff.template.md
  - references/ollvm/toolchain-router.md
  - references/ollvm/workflow-template.md

templates:
  - references/ollvm/task-handoff.template.md

policies:
  - policies/README.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/control-flow-triage.md
  - tooling/recipes/mba-simplification-review.md

teamHints:
  suggestedMembers: 1-2
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: dynamic-debug
    title: 动态调试
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: trace
    title: 动态 trace
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: patch
    title: 二进制或项目修改
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: bulk-rewrite
    title: 批量重命名或注释
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: network
    title: 网络访问
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/ollvm/README.md
  - references/ollvm/workflow-template.md
  - references/ollvm/toolchain-router.md
  - tooling/recipes/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
