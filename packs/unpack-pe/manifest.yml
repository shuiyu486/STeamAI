schemaVersion: 1
name: unpack-pe
version: 0.1.0
description: Authorized PE unpacking and loader triage Agent Team pack skeleton
maturity: skeleton

managedFiles:
  - references/unpack-pe/README.md
  - references/unpack-pe/agent-team.md
  - references/unpack-pe/workflow-template.md
  - references/unpack-pe/toolchain-router.md

templateFiles:
  - references/unpack-pe/task-handoff.template.md

localNeverOverwrite:
  - CLAUDE.local.md
  - references/unpack-pe/task-handoff.md
  - tools.local.yml

managedBlock:
  file: CLAUDE.local.md
  blockId: unpack-pe:router
  source: CLAUDE.local.snippet.md

syncPolicy:
  managedFiles: overwrite-with-backup
  templateFiles: create-if-missing
  localFiles: never-overwrite

workstreamDefaults:
  defaultAuthorityLane: main
  defaultStartLaneType: unpack-analysis
  handoffPath: references/unpack-pe/task-handoff.md
  backupRoot: .rekit/backups/sync
  requestDefaultTargetLane: main

authorityFiles:
  - references/unpack-pe/task-handoff.md

commonPolicies:
  - agent-team
  - tool-adapters
  - context-budget
  - subagents
  - lane-collaboration
  - review-first
  - write-boundaries
  - verification
  - evidence
  - tool-output
  - handoff

policyOverlays: []

subagentRoutes:
  - id: unpack-pe:bounded-review
    taskTypes: finding-review,evidence-review,unpack-review,loader-review,tooling-review
    trigger: fixed-boundary read-only review for PE unpacking findings, evidence notes, loader hypotheses, or tooling notes
    shardBasis: sample-or-finding
    targetItemsPerAgent: 4
    maxParallel: 3
    reference: references/unpack-pe/agent-team.md
    policyOverlay:
    subagentPermissions: read-only
    mainAgentOwns: ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,sample_ref,packer_hint,loader_stage,section_ref,candidate_path,defer_reason
  - id: unpack-pe:unpack-analysis
    taskTypes: unpack-analysis,pe-triage,loader-triage,import-recovery,overlay-review,stub-analysis
    trigger: PE unpacking workspace has sample aliases, loader hypotheses, unpack candidates, import recovery notes, or needs bounded analysis before main merge
    shardBasis: sample-or-loader-stage
    targetItemsPerAgent: 2
    maxParallel: 2
    reference: references/unpack-pe/agent-team.md
    policyOverlay:
    subagentPermissions: read-only-or-workspace-only
    mainAgentOwns: canonical-write,ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,sample_ref,packer_hint,loader_stage,section_ref,import_state,unpack_candidate_ref,candidate_path,defer_reason

promoteFiles:
  - references/unpack-pe/README.md
  - references/unpack-pe/agent-team.md
  - references/unpack-pe/workflow-template.md
  - references/unpack-pe/toolchain-router.md

toolingFiles:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/pe-static-triage.md
  - tooling/recipes/loader-unpack-review.md

promptFiles: []

laneTypes:
  - id: main
    title: PE unpacking mainline
    authority: true
    workspaceRoot: workspace/main
    canWrite: references/unpack-pe/task-handoff.md
    readOnly: .rekit/facts/**
    outputs: publication,decision,observation
  - id: unpack-analysis
    title: Unpack / loader analysis
    authority: false
    workspaceRoot: workspace/unpack
    canWrite: own-workspace
    readOnly: references/unpack-pe/**,.rekit/facts/**
    outputs: observation,request,candidate,summary
  - id: tooling
    title: Tooling and adapter evaluation
    authority: false
    workspaceRoot: workspace/tooling
    canWrite: own-workspace
    readOnly: references/unpack-pe/**,.rekit/facts/**
    outputs: observation,request,candidate,tooling-change

toolingCandidateSources:
  - references/unpack-pe/toolchain-router.md

heavyToolGates:
  - id: full-trace
    title: Full trace capture
    sideEffects: full-trace,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: budget-exhausted,scope-drift,output-exceeds-bounded-evidence-packet
  - id: debug
    title: Dynamic debug or attach
    sideEffects: debug,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: timeout,unexpected-side-effect,scope-drift
  - id: inject
    title: Runtime injection or hook
    sideEffects: inject,filesystem-write
    defaultRisk: critical
    requiresConfirmation: true
    stopConditions: unexpected-mutation,scope-drift,budget-exhausted
  - id: patch
    title: Binary or project patch
    sideEffects: patch,filesystem-write
    defaultRisk: critical
    requiresConfirmation: true
    stopConditions: overwrite-risk,scope-drift,no-rollback-path
  - id: dump
    title: Memory or artifact dump
    sideEffects: dump,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: output-exceeds-bounded-evidence-packet,sensitive-artifact-detected,scope-drift
  - id: network
    title: Network access or replay
    sideEffects: network,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: live-target-ambiguity,unexpected-outbound-request,scope-drift
  - id: symex
    title: Long symbolic execution
    sideEffects: symex,filesystem-write
    defaultRisk: medium
    requiresConfirmation: true
    stopConditions: path-explosion,budget-exhausted,output-exceeds-bounded-evidence-packet

promoteDenyPatterns:
  - "C:\\"
  - "samples[\\/]"
  - "artifacts[\\/]"
  - "captures[\\/]"
  - "dumps?[\\/]"
  - "traces?[\\/]"
  - "evidence[\\/]raw[\\/]"
  - "memory[\\/]"
  - "unpacked[\\/]"
  - "patched[\\/]"
  - "[A-Za-z0-9_.-]*(sample|malware|payload|unpacked|packed|dump|trace|pcap|capture|memory|patch|loader)[A-Za-z0-9_.-]*\.(exe|dll|sys|bin|dat|raw|dmp|mem|pcap|pcapng|zip|7z|rar|log|json)"
  - "(?i)sha256\s*[:=]\s*[0-9a-f]{64}"
  - "(?i)sha1\s*[:=]\s*[0-9a-f]{40}"
  - "(?i)md5\s*[:=]\s*[0-9a-f]{32}"
  - "(?i)(authorization|cookie|set-cookie)\s*[:=]"
  - "(?i)(api[_-]?key|token|secret|password|credential)\s*[:=]"
  - "(?i)bearer\s+[A-Za-z0-9._~+\/-]+"
  - "\b(10|172\.(1[6-9]|2[0-9]|3[0-1])|192\.168)\."
  - "0x[0-9A-Fa-f]{6,}"
  - "ctx[0-9]+"
  - "round[0-9]+"
  - "Task #[0-9]+"

budgets:
  CLAUDE.local.md: 8192
  references/unpack-pe/task-handoff.md: 12288
  defaultMarkdown: 16384
