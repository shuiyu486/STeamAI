schemaVersion: 2
name: unpack-pe
version: 1.0.0
description: 面向已授权 PE unpacking、loader triage 与 import recovery 的声明式研究 pack。
maturity: declarative-vnext

entrypoints:
  router: references/unpack-pe/README.md
  team: references/unpack-pe/agent-team.md
  workflow: references/unpack-pe/workflow-template.md
  tooling: references/unpack-pe/toolchain-router.md

references:
  - references/unpack-pe/README.md
  - references/unpack-pe/agent-team.md
  - references/unpack-pe/task-handoff.template.md
  - references/unpack-pe/toolchain-router.md
  - references/unpack-pe/workflow-template.md

templates:
  - references/unpack-pe/task-handoff.template.md

policies:
  - policies/README.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/loader-unpack-review.md
  - tooling/recipes/pe-static-triage.md

teamHints:
  suggestedMembers: 1-2
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: dynamic-debug
    title: 动态调试
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: sample-execute
    title: 样本执行
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: dump
    title: 内存或文件导出
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: patch
    title: 二进制修改
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: write-output
    title: 写 unpacked 输出
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: network
    title: 网络访问
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/unpack-pe/README.md
  - references/unpack-pe/workflow-template.md
  - references/unpack-pe/toolchain-router.md
  - tooling/recipes/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
