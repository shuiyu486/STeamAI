schemaVersion: 1
name: vmp-re
version: 0.2.0
description: VMProtect x64 trace-based devirtualization context kit
maturity: mature

managedFiles:
  - references/vmp-re/README.md
  - references/vmp-re/agent-driven-re.md
  - references/vmp-re/workflow-template.md
  - references/vmp-re/progressive-disclosure.md
  - references/vmp-re/toolchain-router.md
  - references/vmp-re/singleton-handler-review.md
  - references/vmp-re/lane-collaboration.md

templateFiles:
  - references/vmp-re/task-handoff.template.md

localNeverOverwrite:
  - CLAUDE.local.md
  - references/vmp-re/task-handoff.md
  - tools.local.yml

managedBlock:
  file: CLAUDE.local.md
  blockId: vmp-re-template:router
  source: CLAUDE.local.snippet.md

syncPolicy:
  managedFiles: overwrite-with-backup
  templateFiles: create-if-missing
  localFiles: never-overwrite

workstreamDefaults:
  defaultAuthorityLane: devirt-main
  defaultStartLaneType: feature-analysis
  handoffPath: references/vmp-re/task-handoff.md
  backupRoot: references/vmp-re/.backup
  requestDefaultTargetLane: devirt-main

authorityFiles:
  - captures/vm_opcode_semantics_confirmed.csv
  - captures/vm_handler_roles_confirmed.csv
  - references/vmp-re/task-handoff.md

commonPolicies:
  - context-budget
  - subagents
  - lane-collaboration
  - review-first
  - write-boundaries
  - verification
  - evidence
  - tool-output
  - handoff

policyOverlays:
  - policies/subagents.overlay.md
  - policies/lane-collaboration.overlay.md
  - policies/context-budget.overlay.md
  - policies/review-first.overlay.md
  - policies/verification.overlay.md

subagentRoutes:
  - id: vmp-re:bounded-review
    taskTypes: handler-lowering,focused-batch-review,instruction-level-review,trace-review,value-flow-review,tooling-diff-review
    trigger: fixed-boundary read-only batch review; candidates >= 4 or alias/low-occurrence blockers or long trace/value-flow evidence
    shardBasis: handler
    targetItemsPerAgent: 4
    maxParallel: 3
    reference: references/vmp-re/progressive-disclosure.md
    policyOverlay: policies/subagents.overlay.md
    subagentPermissions: read-only
    mainAgentOwns: csv-backup,csv-write,validation,handoff-update
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,handler,csv_ready,row,defer_reason
  - id: vmp-re:lane-feature-analysis
    taskTypes: feature-analysis,function-analysis,lane-feature-review,lowering-request-review
    trigger: feature workspace has requests/candidates or needs merge review
    shardBasis: feature
    targetItemsPerAgent: 1
    maxParallel: 2
    reference: references/vmp-re/lane-collaboration.md
    policyOverlay: policies/lane-collaboration.overlay.md
    subagentPermissions: read-only-or-workspace-only
    mainAgentOwns: canonical-write,confirmed-csv,validation,handoff-update,authority-sync
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,feature,request_id,candidate_path,defer_reason

promoteFiles:
  - references/vmp-re/README.md
  - references/vmp-re/agent-driven-re.md
  - references/vmp-re/workflow-template.md
  - references/vmp-re/progressive-disclosure.md
  - references/vmp-re/toolchain-router.md
  - references/vmp-re/singleton-handler-review.md
  - references/vmp-re/lane-collaboration.md

toolingFiles:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/public-tool-triage.md
  - tooling/recipes/lane-collaboration.md
  - tooling/recipes/vmenter-context-probe.md
  - tooling/recipes/unicorn-trace.md
  - tooling/recipes/focused-handler-review.md
  - tooling/recipes/value-flow-mining.md
  - tooling/recipes/ida-x64dbg-mcp.md
  - tooling/recipes/ida-agent-bridge-readonly.md
  - tooling/scripts/README.md
  - tooling/patches/vmpimportfixer-timeout-and-quiet-log.md

promptFiles:
  - common/prompts/lane-main-session.md
  - common/prompts/lane-feature-session.md
  - common/prompts/lane-merge-review.md
  - packs/vmp-re/prompts/feature-analysis-session.md

laneTypes:
  - id: devirt-main
    title: VMProtect 脱壳主线
    authority: true
    workspaceRoot: captures/devirt_main
    canWrite: captures/vm_opcode_semantics_confirmed.csv,captures/vm_handler_roles_confirmed.csv,references/vmp-re/task-handoff.md,captures/routine_ir.events.csv,captures/routine_ir.summary.csv,captures/routine_ir.md
    readOnly: .rekit/facts/**
    outputs: publication,authority-update,resolved-request,observation
  - id: feature-analysis
    title: 功能分析
    authority: false
    workspaceRoot: captures/feature_analysis
    canWrite: own-workspace
    readOnly: captures/vm_opcode_semantics_confirmed.csv,captures/vm_handler_roles_confirmed.csv,captures/routine_ir.events.csv,captures/routine_ir.summary.csv,captures/routine_ir.md,references/vmp-re/task-handoff.md,.rekit/facts/**
    outputs: observation,request,candidate,summary
  - id: tooling
    title: 工具链开发
    authority: false
    workspaceRoot: captures/tooling_lanes
    canWrite: own-workspace
    readOnly: .rekit/facts/**,references/vmp-re/**
    outputs: observation,request,candidate,tooling-change

toolingCandidateSources:
  - references/vmp-re/toolchain-router.md
  - references/vmp-re/lane-collaboration.md

heavyToolGates:
  - id: inspect
    title: Existing IDA sidecar index inspection
    sideEffects: inspect,filesystem-read,bounded-packet-write
    defaultRisk: medium
    requiresConfirmation: true
    stopConditions: scope-drift,source-drift,output-exceeds-bounded-evidence-packet
  - id: full-trace
    title: Full trace capture
    sideEffects: full-trace,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: budget-exhausted,scope-drift,output-exceeds-bounded-evidence-packet
  - id: debug
    title: Dynamic debug or attach
    sideEffects: debug,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: timeout,unexpected-side-effect,scope-drift
  - id: inject
    title: Runtime injection or hook
    sideEffects: inject,filesystem-write
    defaultRisk: critical
    requiresConfirmation: true
    stopConditions: unexpected-mutation,scope-drift,budget-exhausted
  - id: patch
    title: Binary or project patch
    sideEffects: patch,filesystem-write
    defaultRisk: critical
    requiresConfirmation: true
    stopConditions: overwrite-risk,scope-drift,no-rollback-path
  - id: dump
    title: Memory or artifact dump
    sideEffects: dump,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: output-exceeds-bounded-evidence-packet,sensitive-artifact-detected,scope-drift
  - id: network
    title: Network access or replay
    sideEffects: network,filesystem-write
    defaultRisk: high
    requiresConfirmation: true
    stopConditions: live-target-ambiguity,unexpected-outbound-request,scope-drift
  - id: symex
    title: Long symbolic execution
    sideEffects: symex,filesystem-write
    defaultRisk: medium
    requiresConfirmation: true
    stopConditions: path-explosion,budget-exhausted,output-exceeds-bounded-evidence-packet

promoteDenyPatterns:
  - "C:\\"
  - "artifacts[\\/]"
  - "captures[\\/]"
  - "[A-Za-z0-9_.-]*trace[A-Za-z0-9_.-]*\.(csv|jsonl|log|txt|bin)"
  - "[A-Za-z0-9_.-]*dump[A-Za-z0-9_.-]*\.(dmp|bin|raw|exe|dll)"
  - "\.dmp\b"
  - "0x[0-9A-Fa-f]{6,}"
  - "ctx[0-9]+"
  - "round[0-9]+"
  - "Task #[0-9]+"

budgets:
  CLAUDE.local.md: 8192
  references/vmp-re/task-handoff.md: 12288
  references/vmp-re/lane-collaboration.md: 16384
  defaultMarkdown: 16384
