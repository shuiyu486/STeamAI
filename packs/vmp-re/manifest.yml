schemaVersion: 1
name: vmp-re
version: 0.2.0
description: VMProtect x64 trace-based devirtualization context kit

managedFiles:
  - references/vmp-re/README.md
  - references/vmp-re/workflow-template.md
  - references/vmp-re/progressive-disclosure.md
  - references/vmp-re/toolchain-router.md
  - references/vmp-re/singleton-handler-review.md
  - references/vmp-re/parallel-sessions.md

templateFiles:
  - references/vmp-re/task-handoff.template.md

localNeverOverwrite:
  - CLAUDE.local.md
  - references/vmp-re/task-handoff.md
  - tools.local.yml

managedBlock:
  file: CLAUDE.local.md
  blockId: vmp-re-template:router
  source: CLAUDE.local.snippet.md

syncPolicy:
  managedFiles: overwrite-with-backup
  templateFiles: create-if-missing
  localFiles: never-overwrite

commonPolicies:
  - context-budget
  - subagents
  - parallel-sessions
  - review-first
  - write-boundaries
  - verification
  - evidence
  - tool-output
  - handoff

policyOverlays:
  - policies/subagents.overlay.md
  - policies/parallel-sessions.overlay.md
  - policies/context-budget.overlay.md
  - policies/review-first.overlay.md
  - policies/verification.overlay.md

subagentRoutes:
  - id: vmp-re:bounded-review
    taskTypes: handler-lowering,focused-batch-review,instruction-level-review,trace-review,value-flow-review,tooling-diff-review
    trigger: fixed-boundary read-only batch review; candidates >= 4 or alias/low-occurrence blockers or long trace/value-flow evidence
    shardBasis: handler
    targetItemsPerAgent: 4
    maxParallel: 3
    reference: references/vmp-re/progressive-disclosure.md
    policyOverlay: policies/subagents.overlay.md
    subagentPermissions: read-only
    mainAgentOwns: csv-backup,csv-write,validation,handoff-update
    outputContract: item,decision,confidence,evidence,risk,next_action,handler,csv_ready,row,defer_reason
  - id: vmp-re:parallel-feature-analysis
    taskTypes: feature-analysis,function-analysis,parallel-feature-review,lowering-request-review
    trigger: feature workspace has requests/candidates or needs merge review
    shardBasis: feature
    targetItemsPerAgent: 1
    maxParallel: 2
    reference: references/vmp-re/parallel-sessions.md
    policyOverlay: policies/parallel-sessions.overlay.md
    subagentPermissions: read-only-or-workspace-only
    mainAgentOwns: canonical-write,confirmed-csv,validation,handoff-update,authority-sync
    outputContract: item,decision,confidence,evidence,risk,next_action,feature,request_id,candidate_path,defer_reason

promoteFiles:
  - references/vmp-re/README.md
  - references/vmp-re/workflow-template.md
  - references/vmp-re/progressive-disclosure.md
  - references/vmp-re/toolchain-router.md
  - references/vmp-re/singleton-handler-review.md
  - references/vmp-re/parallel-sessions.md

toolingFiles:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/public-tool-triage.md
  - tooling/recipes/parallel-sessions.md
  - tooling/recipes/vmenter-context-probe.md
  - tooling/recipes/unicorn-trace.md
  - tooling/recipes/focused-handler-review.md
  - tooling/recipes/value-flow-mining.md
  - tooling/recipes/ida-x64dbg-mcp.md
  - tooling/scripts/README.md
  - tooling/patches/vmpimportfixer-timeout-and-quiet-log.md

promptFiles:
  - common/prompts/parallel-main-session.md
  - common/prompts/parallel-feature-session.md
  - common/prompts/parallel-merge-review.md
  - packs/vmp-re/prompts/feature-analysis-session.md

parallelTemplateFiles:
  - templates/parallel/feature-analysis/summary.template.md
  - templates/parallel/feature-analysis/evidence.template.md
  - templates/parallel/feature-analysis/notes.template.md
  - templates/parallel/feature-analysis/vm_blockers.template.csv
  - templates/parallel/feature-analysis/lowering_requests.template.csv
  - templates/parallel/feature-analysis/handler_roles.template.csv
  - templates/parallel/feature-analysis/opcode_semantics.template.csv
  - templates/parallel/feature-analysis/START_HERE.template.md
  - templates/parallel/feature-analysis/FEATURE_RESUME.template.md
  - templates/parallel/feature-analysis/MAIN_RESUME.template.md
  - templates/parallel/feature-analysis/AUTHORITY_RESUME.template.md
  - templates/parallel/feature-analysis/STANDALONE_RESUME.template.md

parallelDefaults:
  defaultKind: feature-analysis
  sessionRoot: .rekit/parallel
  reviewRoot: .rekit/reviews
  workspaceRoot: captures/feature_analysis
  workspaceDateLayout: "20060102"
  initialStatus: open
  defaultLifecycleMode: attached_to_main

parallelFiles:
  - kind: feature-analysis
    path: summary.md
    category: summary
    template: templates/parallel/feature-analysis/summary.template.md
    artifactKind: summary
    required: true
    includeInReview: true
    includeInDoctor: true
  - kind: feature-analysis
    path: evidence.md
    category: evidence
    template: templates/parallel/feature-analysis/evidence.template.md
    artifactKind: evidence
    required: true
    includeInReview: true
    includeInDoctor: true
  - kind: feature-analysis
    path: notes.md
    category: notes
    template: templates/parallel/feature-analysis/notes.template.md
    artifactKind: support
    required: false
    includeInReview: true
    includeInDoctor: false
  - kind: feature-analysis
    path: vm_blockers.csv
    category: blocker
    template: templates/parallel/feature-analysis/vm_blockers.template.csv
    statusColumn: status
    counterName: vmBlockers
    artifactKind: vm-blockers
    required: true
    includeInReview: true
    includeInDoctor: true
  - kind: feature-analysis
    path: lowering_requests.csv
    category: request
    template: templates/parallel/feature-analysis/lowering_requests.template.csv
    statusColumn: status
    counterName: loweringRequests
    artifactKind: lowering-requests
    required: true
    includeInReview: true
    includeInDoctor: true
  - kind: feature-analysis
    path: candidates/handler_roles.csv
    category: candidate
    template: templates/parallel/feature-analysis/handler_roles.template.csv
    statusColumn: status
    counterName: candidateRows
    artifactKind: candidate
    required: false
    includeInReview: true
    includeInDoctor: false
  - kind: feature-analysis
    path: candidates/opcode_semantics.csv
    category: candidate
    template: templates/parallel/feature-analysis/opcode_semantics.template.csv
    statusColumn: status
    counterName: candidateRows
    artifactKind: candidate
    required: false
    includeInReview: true
    includeInDoctor: false

parallelReadOnlyFiles:
  - captures/vm_opcode_semantics_confirmed.csv
  - captures/vm_handler_roles_confirmed.csv
  - captures/routine_ir.events.csv
  - captures/routine_ir.summary.csv
  - captures/routine_ir.md
  - captures/routine_ir.superinstructions.csv
  - captures/routine_ir.superinstructions.md
  - references/vmp-re/task-handoff.md

laneTypes:
  - id: devirt-main
    title: VMProtect 脱壳主线
    authority: true
    workspaceRoot: captures/devirt_main
    canWrite: captures/vm_opcode_semantics_confirmed.csv,captures/vm_handler_roles_confirmed.csv,references/vmp-re/task-handoff.md,captures/routine_ir.events.csv,captures/routine_ir.summary.csv,captures/routine_ir.md
    readOnly: .rekit/facts/**
    outputs: publication,authority-update,resolved-request,observation
  - id: feature-analysis
    title: 功能分析
    authority: false
    workspaceRoot: captures/feature_analysis
    canWrite: own-workspace
    readOnly: captures/vm_opcode_semantics_confirmed.csv,captures/vm_handler_roles_confirmed.csv,captures/routine_ir.events.csv,captures/routine_ir.summary.csv,captures/routine_ir.md,references/vmp-re/task-handoff.md,.rekit/facts/**
    outputs: observation,request,candidate,summary
  - id: tooling
    title: 工具链开发
    authority: false
    workspaceRoot: captures/tooling_lanes
    canWrite: own-workspace
    readOnly: .rekit/facts/**,references/vmp-re/**
    outputs: observation,request,candidate,tooling-change

toolingCandidateSources:
  - references/vmp-re/toolchain-router.md
  - references/vmp-re/parallel-sessions.md

promoteDenyPatterns:
  - "C:\\"
  - "artifacts[\\/]"
  - "captures[\\/]"
  - "[A-Za-z0-9_.-]*trace[A-Za-z0-9_.-]*\.(csv|jsonl|log|txt|bin)"
  - "[A-Za-z0-9_.-]*dump[A-Za-z0-9_.-]*\.(dmp|bin|raw|exe|dll)"
  - "\.dmp\b"
  - "0x[0-9A-Fa-f]{6,}"
  - "ctx[0-9]+"
  - "round[0-9]+"
  - "Task #[0-9]+"

budgets:
  CLAUDE.local.md: 8192
  references/vmp-re/task-handoff.md: 12288
  references/vmp-re/parallel-sessions.md: 16384
  defaultMarkdown: 16384
