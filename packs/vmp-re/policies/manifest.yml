      validate: true
  - id: review-first-vmp
    extends: review-first
    path: review-first.overlay.md
    title: VMP RE review-first overlay
    lifecycle:
      sync: managed
      promote: review-first
      validate: true
  - id: verification-vmp
    extends: verification
    path: verification.overlay.md
    title: VMP routine IR verification overlay
    lifecycle:
      sync: managed
      promote: review-first
      validate: true

budgets:
