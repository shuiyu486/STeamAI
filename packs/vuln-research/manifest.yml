schemaVersion: 2
name: vuln-research
version: 1.0.0
description: 面向已授权漏洞研究、防御性复现、补丁与崩溃分析的声明式研究 pack。
maturity: declarative-vnext

entrypoints:
  router: references/vuln-research/README.md
  team: references/vuln-research/agent-team.md
  workflow: references/vuln-research/workflow-template.md
  tooling: references/vuln-research/toolchain-router.md

references:
  - references/vuln-research/README.md
  - references/vuln-research/agent-team.md
  - references/vuln-research/task-handoff.template.md
  - references/vuln-research/toolchain-router.md
  - references/vuln-research/workflow-template.md

templates:
  - references/vuln-research/task-handoff.template.md

policies:
  - policies/README.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/crash-triage.md
  - tooling/recipes/repro-sidecar-review.md

teamHints:
  suggestedMembers: 1-2
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: scan
    title: 主动扫描
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: fuzz
    title: 有界 fuzz
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: exploit-replay
    title: 利用复现
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: live-repro
    title: 真实目标复现
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: debug
    title: 动态调试
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: data-export
    title: 数据导出
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/vuln-research/README.md
  - references/vuln-research/workflow-template.md
  - references/vuln-research/toolchain-router.md
  - tooling/recipes/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
