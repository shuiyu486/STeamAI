schemaVersion: 1
name: vuln-research
version: 0.1.0
description: Authorized vulnerability research Agent Team pack skeleton
maturity: skeleton

managedFiles:
  - references/vuln-research/README.md
  - references/vuln-research/agent-team.md
  - references/vuln-research/workflow-template.md
  - references/vuln-research/toolchain-router.md

templateFiles:
  - references/vuln-research/task-handoff.template.md

localNeverOverwrite:
  - CLAUDE.local.md
  - references/vuln-research/task-handoff.md
  - tools.local.yml

managedBlock:
  file: CLAUDE.local.md
  blockId: vuln-research:router
  source: CLAUDE.local.snippet.md

syncPolicy:
  managedFiles: overwrite-with-backup
  templateFiles: create-if-missing
  localFiles: never-overwrite

workstreamDefaults:
  defaultAuthorityLane: main
  defaultStartLaneType: vuln-analysis
  handoffPath: references/vuln-research/task-handoff.md
  backupRoot: .rekit/backups/sync
  requestDefaultTargetLane: main

authorityFiles:
  - references/vuln-research/task-handoff.md

commonPolicies:
  - agent-team
  - tool-adapters
  - context-budget
  - subagents
  - lane-collaboration
  - review-first
  - write-boundaries
  - verification
  - evidence
  - tool-output
  - handoff

policyOverlays: []

subagentRoutes:
  - id: vuln-research:bounded-review
    taskTypes: finding-review,evidence-review,crash-review,repro-review,patch-review,tooling-review
    trigger: fixed-boundary read-only review for vulnerability findings, repro evidence, crash notes, patch analysis, or tooling notes
    shardBasis: finding-or-repro
    targetItemsPerAgent: 4
    maxParallel: 3
    reference: references/vuln-research/agent-team.md
    policyOverlay:
    subagentPermissions: read-only
    mainAgentOwns: ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,target_ref,bug_class,repro_ref,crash_id,patch_ref,candidate_path,defer_reason
  - id: vuln-research:vuln-analysis
    taskTypes: vuln-analysis,root-cause-analysis,crash-triage,patch-diff,repro-analysis,exploitability-review
    trigger: vulnerability workspace has crash notes, patch diffs, repro hypotheses, candidate root cause, or needs bounded analysis before main merge
    shardBasis: target-or-bug-class
    targetItemsPerAgent: 2
    maxParallel: 2
    reference: references/vuln-research/agent-team.md
    policyOverlay:
    subagentPermissions: read-only-or-workspace-only
    mainAgentOwns: canonical-write,ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,target_ref,bug_class,repro_ref,crash_id,patch_ref,impact_hypothesis,candidate_path,defer_reason

promoteFiles:
  - references/vuln-research/README.md
  - references/vuln-research/agent-team.md
  - references/vuln-research/workflow-template.md
  - references/vuln-research/toolchain-router.md

toolingFiles:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/crash-triage.md
  - tooling/recipes/repro-sidecar-review.md

promptFiles: []

laneTypes:
  - id: main
    title: Vulnerability research mainline
    authority: true
    workspaceRoot: workspace/main
    canWrite: references/vuln-research/task-handoff.md
    readOnly: .rekit/facts/**
    outputs: publication,decision,observation
  - id: vuln-analysis
    title: Root cause / repro analysis
    authority: false
    workspaceRoot: workspace/vulns
    canWrite: own-workspace
    readOnly: references/vuln-research/**,.rekit/facts/**
    outputs: observation,request,candidate,summary
  - id: tooling
    title: Tooling and adapter evaluation
    authority: false
    workspaceRoot: workspace/tooling
    canWrite: own-workspace
    readOnly: references/vuln-research/**,.rekit/facts/**
    outputs: observation,request,candidate,tooling-change

toolingCandidateSources:
  - references/vuln-research/toolchain-router.md

promoteDenyPatterns:
  - "C:\\"
  - "artifacts[\\/]"
  - "captures[\\/]"
  - "crashes[\\/]"
  - "dumps?[\\/]"
  - "pcaps?[\\/]"
  - "evidence[\\/]raw[\\/]"
  - "repro[\\/]raw[\\/]"
  - "[A-Za-z0-9_.-]*(crash|core|dump|minidump|trace|pcap|capture|payload|exploit|poc)[A-Za-z0-9_.-]*\.(dmp|core|raw|mem|pcap|pcapng|har|zip|7z|rar|bin|dat|log|txt|json|xml)"
  - "(?i)(authorization|cookie|set-cookie)\s*[:=]"
  - "(?i)(api[_-]?key|token|secret|password|credential)\s*[:=]"
  - "(?i)bearer\s+[A-Za-z0-9._~+\/-]+"
  - "\b(10|172\.(1[6-9]|2[0-9]|3[0-1])|192\.168)\."
  - "0x[0-9A-Fa-f]{6,}"
  - "ctx[0-9]+"
  - "round[0-9]+"
  - "Task #[0-9]+"

budgets:
  CLAUDE.local.md: 8192
  references/vuln-research/task-handoff.md: 12288
  defaultMarkdown: 16384
