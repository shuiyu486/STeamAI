schemaVersion: 2
name: web-security
version: 1.0.0
description: 面向已授权 Web/API 安全评估、靶场与防御性验证的声明式研究 pack。
maturity: declarative-vnext

entrypoints:
  router: references/web-security/README.md
  team: references/web-security/agent-team.md
  workflow: references/web-security/workflow-template.md
  tooling: references/web-security/toolchain-router.md

references:
  - references/web-security/README.md
  - references/web-security/agent-team.md
  - references/web-security/task-handoff.template.md
  - references/web-security/toolchain-router.md
  - references/web-security/workflow-template.md

templates:
  - references/web-security/task-handoff.template.md

policies:
  - policies/README.md
  - ../../common/policies/context-budget.md
  - ../../common/policies/review-first.md
  - ../../common/policies/write-boundaries.md
  - ../../common/policies/verification.md
  - ../../common/policies/evidence.md

tooling:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/passive-triage.md
  - tooling/recipes/request-replay.md
  - tooling/schemas/bounded-replay-request-v1.schema.json
  - tooling/schemas/bounded-replay-result-v1.schema.json
  - tooling/schemas/openapi-inventory-v1.schema.json

teamHints:
  suggestedMembers: 1-2
  reviewer: on-important-finding-or-delivery
  ownerPerQuestion: 1
  verifierPerQuestion: 1
  durableTeamLimit: 3-executors-plus-1-reviewer

heavyActions:
  - id: network-request
    title: 网络请求
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: request-replay
    title: 请求重放
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: scan
    title: 主动扫描
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: fuzz
    title: 有界 fuzz
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: high-volume
    title: 高流量访问
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]
  - id: state-change
    title: 服务端状态修改
    risk: high
    requiredAuthorization: exact-case-scope-and-specific-user-confirmation
    requiredToolPermission: true
    stopConditions: [scope-drift, budget-exhausted, unexpected-side-effect]

learningTargets:
  - references/web-security/README.md
  - references/web-security/workflow-template.md
  - references/web-security/toolchain-router.md
  - tooling/recipes/*.md

denyPatterns:
  - real-case-identifiers
  - raw-artifacts
  - credentials-or-tokens
  - absolute-case-paths
  - customer-environment-details
  - unredacted-network-data

budgets:
  CLAUDE.local.md: 8192
  defaultMarkdown: 16384
