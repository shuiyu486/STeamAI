schemaVersion: 1
name: web-security
version: 0.1.0
description: Web and API security assessment Agent Team pack skeleton
maturity: skeleton

managedFiles:
  - references/web-security/README.md
  - references/web-security/agent-team.md
  - references/web-security/workflow-template.md
  - references/web-security/toolchain-router.md

templateFiles:
  - references/web-security/task-handoff.template.md

localNeverOverwrite:
  - CLAUDE.local.md
  - references/web-security/task-handoff.md
  - tools.local.yml

managedBlock:
  file: CLAUDE.local.md
  blockId: web-security:router
  source: CLAUDE.local.snippet.md

syncPolicy:
  managedFiles: overwrite-with-backup
  templateFiles: create-if-missing
  localFiles: never-overwrite

workstreamDefaults:
  defaultAuthorityLane: main
  defaultStartLaneType: feature
  handoffPath: references/web-security/task-handoff.md
  backupRoot: .rekit/backups/sync
  requestDefaultTargetLane: main

authorityFiles:
  - references/web-security/task-handoff.md

commonPolicies:
  - agent-team
  - tool-adapters
  - context-budget
  - subagents
  - lane-collaboration
  - review-first
  - write-boundaries
  - verification
  - evidence
  - tool-output
  - handoff

policyOverlays: []

subagentRoutes:
  - id: web-security:bounded-review
    taskTypes: finding-review,evidence-review,endpoint-review,api-flow-review,tooling-review
    trigger: fixed-boundary read-only review for findings, endpoint evidence, API flows, or tooling notes
    shardBasis: finding-or-endpoint
    targetItemsPerAgent: 4
    maxParallel: 3
    reference: references/web-security/agent-team.md
    policyOverlay:
    subagentPermissions: read-only
    mainAgentOwns: ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,endpoint,method,impact,defer_reason
  - id: web-security:feature-analysis
    taskTypes: feature-analysis,endpoint-analysis,api-flow-analysis,authz-review,input-validation-review
    trigger: feature or endpoint workspace has requests, hypotheses, candidate findings, or needs bounded analysis before main merge
    shardBasis: endpoint-or-flow
    targetItemsPerAgent: 2
    maxParallel: 2
    reference: references/web-security/agent-team.md
    policyOverlay:
    subagentPermissions: read-only-or-workspace-only
    mainAgentOwns: canonical-write,ledger-writeback,validation,handoff-update,authority-confirmation
    outputContract: item,decision,confidence,evidence,risk,next_action,tier_used,tool_scope,feature,endpoint,request_id,candidate_path,defer_reason

promoteFiles:
  - references/web-security/README.md
  - references/web-security/agent-team.md
  - references/web-security/workflow-template.md
  - references/web-security/toolchain-router.md

toolingFiles:
  - tooling/README.md
  - tooling/catalog.yml
  - tooling/recipes/passive-triage.md
  - tooling/recipes/request-replay.md

promptFiles: []

laneTypes:
  - id: main
    title: Web/API 安全主线
    authority: true
    workspaceRoot: workspace/main
    canWrite: references/web-security/task-handoff.md
    readOnly: .rekit/facts/**
    outputs: publication,decision,observation
  - id: feature
    title: Endpoint / 功能分析
    authority: false
    workspaceRoot: workspace/features
    canWrite: own-workspace
    readOnly: references/web-security/**,.rekit/facts/**
    outputs: observation,request,candidate,summary
  - id: tooling
    title: 工具与 adapter 评估
    authority: false
    workspaceRoot: workspace/tooling
    canWrite: own-workspace
    readOnly: references/web-security/**,.rekit/facts/**
    outputs: observation,request,candidate,tooling-change

toolingCandidateSources:
  - references/web-security/toolchain-router.md

promoteDenyPatterns:
  - "C:\\"
  - "artifacts[\\/]"
  - "captures[\\/]"
  - "evidence[\\/]raw[\\/]"
  - "[A-Za-z0-9_.-]*(har|pcap|burp|zap|request|response)[A-Za-z0-9_.-]*\.(har|pcap|json|xml|log|txt)"
  - "(?i)authorization\s*[:=]\s*(bearer|basic|digest|negotiate|ntlm|token)\s+"
  - "(?i)(cookie|set-cookie|api[_-]?key|token|secret|password)\s*[:=]"
  - "(?i)bearer\s+[A-Za-z0-9._~+\/-]+"
  - "\b(10|172\.(1[6-9]|2[0-9]|3[0-1])|192\.168)\."
  - "0x[0-9A-Fa-f]{6,}"
  - "ctx[0-9]+"
  - "round[0-9]+"
  - "Task #[0-9]+"

budgets:
  CLAUDE.local.md: 8192
  references/web-security/task-handoff.md: 12288
  defaultMarkdown: 16384
