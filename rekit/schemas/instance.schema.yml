# rekit case instance schema v1（说明性文档）

required:
  - schemaVersion
  - templateRoot
  - templatePack
  - projectName
  - projectRoot

fields:
  schemaVersion: 当前为 1
  templateRoot: STeamAI 本地 source clone 根目录
  templatePack: 绑定的 pack 名称，例如 binary-re
  projectName: case 名称
  projectRoot: case 根目录
  mode: 推荐为 case-local-shim

state:
  file: .rekit/state.json
  purpose: 记录 managed 文件上次 sync hash、promote 候选等机器状态
