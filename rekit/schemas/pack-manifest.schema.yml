# rekit pack manifest schema v1（说明性文档）

required:
  - name
  - version
  - managedFiles
  - templateFiles
  - localNeverOverwrite
  - managedBlock
  - syncPolicy
  - workstreamDefaults
  - authorityFiles
  - toolingCandidateSources
  - budgets

fields:
  name: pack 名称，例如 vmp-re
  version: pack 版本；review packet 会记录此值作为 manifestVersion
  description: 一行用途说明
  managedFiles: 可由 kit 同步到 case、也可按 promotePolicy 反向提升的文件路径列表
  templateFiles: 只在 case 缺失时实例化的模板文件列表
  localNeverOverwrite: 永不被 sync 覆盖、永不被 promote 的 case-local 文件
  managedBlock: 单个 managed block 定义，包含 file/blockId/source
  syncPolicy: sync 默认策略；当前 runtime 支持 managedFiles=overwrite-with-backup、templateFiles=create-if-missing、localFiles=never-overwrite
  workstreamDefaults: 工作线 runtime 默认值，包含 defaultAuthorityLane、defaultStartLaneType、handoffPath、backupRoot、requestDefaultTargetLane
  authorityFiles: 允许 authority auto-append 的文件 allowlist；必须由 defaultAuthorityLane 的 canWrite 覆盖
  promoteFiles: 允许进入 promote 候选的 managed 文件列表，必须是 managedFiles 子集
  promoteDenyPatterns: promote 安全阻断正则或字符串模式
  subagentRoutes: 可选的子 agent / 工作线 review 分流 route 列表；每项可包含 id、taskTypes、trigger、shardBasis、targetItemsPerAgent、maxParallel、reference、policyOverlay、subagentPermissions、mainAgentOwns、outputContract
  promptFiles: 可选的 common/pack prompt 文档列表，用于 doctor 校验与人工查阅
  laneTypes: 内部工作线类型列表；定义 authority、workspaceRoot、canWrite/readOnly/outputs，供 `/rekit overview/continue/start/handoff` 使用；至少应有一个 authority lane
  b3PolicyFile: case-local `.rekit/policy.yml`，由 runtime 初始化，不写在 manifest 中；此 schema 只说明相关字段
  budgets: Markdown/文本预算，defaultMarkdown 为默认值

workstreamDefaults:
  defaultAuthorityLane: 默认主线 lane type id，必须存在且 authority=true
  defaultStartLaneType: `/rekit start <name>` 默认创建的 lane type id，必须存在
  handoffPath: 可选的长期 handoff 文件路径；为空时项目/工作线 handoff 不引用长期 handoff
  backupRoot: sync 覆盖 managed files 前的 case-local backup 根路径
  requestDefaultTargetLane: request 未声明 targetLane 时默认路由到的 lane type id，必须存在

laneTypes:
  id: 内部工作线类型 slug，例如 devirt-main、feature-analysis、tooling
  title: 给用户看的名称
  authority: true 表示此工作线可作为主线 owner；至少应有一个主线工作线
  workspaceRoot: case 内 workspace 根路径，必须是相对路径且不越出 case
  canWrite: 逗号分隔的可写边界；`own-workspace` 表示只写自己的 workspace
  readOnly: 逗号分隔的只读输入边界，例如 `.rekit/facts/**` 或 confirmed CSV
  outputs: 逗号分隔的事件类型，例如 observation、request、candidate、publication

b3PolicyFile:
  path: `.rekit/policy.yml`
  automationMode: 默认 assisted-autopilot
  autoCollect: 是否自动收集工作线 output events
  autoVerify: 是否运行 rule verifier
  autoRouteRequests: 是否自动把 request 路由到 target 工作线 inbox/tasks
  autoPublishSharedFacts: 是否自动发布低风险 observation/publication
  autoAcceptLowRiskCandidates: 是否自动接受不触碰 authority 且 verifier 通过的 candidate
  authorityAutoAppend: conditional 或 never；只允许 append，不允许 overwrite/delete
  requireEvidence: authority append / accepted candidate 必须有 evidence
  requireVerifier: authority append / accepted candidate 必须有 accepted verifier verdict
  minConfidence: authority append / verifier 接受的最低 confidence
  requireNoConflict: authority CSV 首列 key 冲突时必须拒绝自动写入
  requireSchemaValid: candidate row 必须匹配 authority CSV header
  requireBackup: authority append 前必须写 run-local backup
  requireDiff: authority append 前必须写 bounded diff
  maxAuthorityRowsPerRun: 单次自动 append 的最大行数
  askUserWhen: conflict、overwriteAuthority、deleteAuthority、schemaChange、changesProjectBaseline、externalSideEffect、destructiveAction 等必须问用户

reviewPacketEnvelope:
  packetKind: 固定为 rekit-review
  direction: feature-to-authority
  manifestPath: 生成 packet 时使用的 pack manifest 路径
  manifestVersion: 生成 packet 时使用的 pack version
  reviewRoot: packet 所在 review 目录（case 相对路径）
  isMutation: false 表示 packet 本身不是 authority 写入
  writesReviewArtifacts: true 表示命令会写 review artifact
  reviewRequired: true 表示主线合入前必须 review-first
  producer: 生成器，例如 rekit/plan-subagents 或 rekit/continue
