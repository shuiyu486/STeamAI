# rekit pack manifest schema v1（说明性文档）

required:
  - schemaVersion
  - name
  - version
  - description
  - maturity
  - managedFiles
  - templateFiles
  - localNeverOverwrite
  - managedBlock
  - promoteFiles
  - commonPolicies
  - policyOverlays
  - subagentRoutes
  - toolingFiles
  - promptFiles
  - syncPolicy
  - workstreamDefaults
  - authorityFiles
  - toolingCandidateSources
  - heavyToolGates
  - promoteDenyPatterns
  - budgets
  - laneTypes

fields:
  schemaVersion: pack manifest schema 版本；必须显式声明为 1，runtime 不再接受缺失或其它版本作为 schema-valid manifest
  name: pack 名称，例如 vmp-re；必须显式声明，runtime 不再用 pack id 隐式补齐
  version: pack 版本；review packet 会记录此值作为 manifestVersion；必须显式声明，runtime 不再注入 0.0.0
  description: 一行用途说明；必须显式声明，schema-valid pack 不允许缺用途摘要
  maturity: pack 成熟度，取值为 mature、template、skeleton 或 experimental；`/rekit packs` 直接显示该显式字段
  managedFiles: 可由 kit 同步到 case、也可按 promotePolicy 反向提升的文件路径列表；必须显式声明，即使暂时为空也不能缺 key
  templateFiles: 只在 case 缺失时实例化的模板文件列表；必须显式声明，允许空列表但不能由 runtime 隐式推断
  localNeverOverwrite: 永不被 sync 覆盖、永不被 promote 的 case-local 文件；必须显式声明，允许空列表但不能由 runtime 隐式推断
  managedBlock: 单个 managed block 定义，必须显式声明 file/blockId/source；runtime 不再注入默认 managed block host、blockId 或 source
  syncPolicy: sync 默认策略；必须显式声明 managedFiles=overwrite-with-backup、templateFiles=create-if-missing、localFiles=never-overwrite，不能缺 key 或依赖 runtime fallback
  workstreamDefaults: 工作线 runtime 默认值；必须显式声明 defaultAuthorityLane、defaultStartLaneType、backupRoot、requestDefaultTargetLane，可选 handoffPath，runtime 不提供隐式默认 map
  authorityFiles: 允许 authority auto-append 的文件 allowlist；必须显式声明且至少包含一个文件，并必须由 defaultAuthorityLane 的 canWrite 覆盖
  promoteFiles: 允许进入 promote 候选的 managed 文件列表；必须显式声明、至少包含一个 managed 文件且必须是 managedFiles 子集；runtime 不再把 managedFiles 隐式作为 promoteFiles
  toolingCandidateSources: promote 候选生成时可读取的工具说明源文件列表；必须显式声明且至少包含一个 source 文件
  promoteDenyPatterns: promote 安全阻断正则或字符串模式；必须由 pack 显式声明且至少包含一个模式，runtime 不提供隐式 deny baseline
  commonPolicies: common policy id 列表；必须显式声明，允许空列表但不能由 runtime 隐式推断
  policyOverlays: pack policy overlay 文件列表；必须显式声明，允许空列表但不能由 runtime 隐式推断
  subagentRoutes: 子 agent / 工作线 review 分流 route 列表；必须显式声明，允许空列表；每项必须显式声明 namespaced id（例如 pack:route），且 namespace 必须匹配当前 pack id；taskTypes、trigger、shardBasis、targetItemsPerAgent、maxParallel、reference、subagentPermissions、mainAgentOwns、outputContract 必须齐全，policyOverlay 可为空；shardBasis 必须是小写 slug 或由 -or- 分隔的小写 slug 组合，不能包含空分片项；非空 policyOverlay 必须来自当前 manifest 显式声明的 policyOverlays 列表；subagentPermissions 只能是 read-only 或 read-only-or-workspace-only；taskTypes、mainAgentOwns 与 outputContract 是逗号/分号分隔列表，不能包含空项
  toolingFiles: pack tooling 文档与 catalog 文件列表；必须显式声明，允许空列表但不能由 runtime 隐式推断
  heavyToolGates: pack 声明的重型工具门禁动作列表；必须显式声明且至少包含一个 gate，Go gate runtime 只接受这里声明的 id，并使用 defaultRisk、requiresConfirmation 与 stopConditions 生成 pending-gate preview/request
  promptFiles: common/pack prompt 文档列表；必须显式声明，允许空列表；用于 doctor 校验与人工查阅
  laneTypes: 内部工作线类型列表；必须显式声明且至少包含一个 lane type；每项必须声明 title、workspaceRoot、authority、canWrite、readOnly、outputs，并定义 authority true/false，供 `/rekit overview/continue/start/handoff` 使用；runtime 不再为 title/workspaceRoot 注入默认值，也不再把缺失或非法 authority 静默当作 false，且至少应有一个 authority lane
  b3PolicyFile: case-local `.rekit/policy.yml`，由 runtime 初始化，不写在 manifest 中；此 schema 只说明相关字段
  budgets: Markdown/文本预算；必须显式声明 map 与 defaultMarkdown 正整数，runtime 不再在 manifest load 时注入默认预算

workstreamDefaults:
  defaultAuthorityLane: 默认主线 lane type id，必须存在且 authority=true
  defaultStartLaneType: `/rekit start <name>` 默认创建的 lane type id，必须存在
  handoffPath: 可选的长期 handoff 文件路径；为空时项目/工作线 handoff 不引用长期 handoff
  backupRoot: sync 覆盖 managed files 前的 case-local backup 根路径
  requestDefaultTargetLane: request 未声明 targetLane 时默认路由到的 lane type id，必须存在

heavyToolGates:
  id: gate action slug，例如 debug、dump、full-trace、inject、network、patch、symex；必须唯一，并与 sideEffects 中的同名动作对应
  title: 给用户看的门禁标题
  sideEffects: 逗号分隔的副作用标签；必须包含 action id，可追加 filesystem-write、external-service、device 等描述性标签
  defaultRisk: 默认风险等级，当前支持 medium、high、critical
  requiresConfirmation: 必须显式声明为 true；`gate -WhatIf/-Apply` 只预览或记录 pending-gate request，不授权实际执行；runtime 不再把缺失或非法 requiresConfirmation 静默当作 false
  stopConditions: 逗号分隔的止损条件；当用户未传 `-StopConditions` 时由 Go gate 写入预览/ledger

laneTypes:
  id: 内部工作线类型 slug，例如 devirt-main、feature-analysis、tooling
  title: 给用户看的名称
  authority: 必须显式声明为 true 或 false；true 表示此工作线可作为主线 owner；至少应有一个主线工作线
  workspaceRoot: case 内 workspace 根路径，必须是相对路径且不越出 case
  canWrite: 逗号分隔的可写边界；`own-workspace` 表示只写自己的 workspace
  readOnly: 逗号分隔的只读输入边界，例如 `.rekit/facts/**` 或 confirmed CSV
  outputs: 逗号分隔的事件类型，例如 observation、request、candidate、publication

b3PolicyFile:
  path: `.rekit/policy.yml`
  automationMode: 默认 assisted-autopilot
  autoCollect: 是否自动收集工作线 output events
  autoVerify: 是否运行 rule verifier
  autoRouteRequests: 是否自动把 request 路由到 target 工作线 inbox/tasks
  autoPublishSharedFacts: 是否自动发布低风险 observation/publication
  autoAcceptLowRiskCandidates: 是否自动接受不触碰 authority 且 verifier 通过的 candidate
  authorityAutoAppend: conditional 或 never；只允许 append，不允许 overwrite/delete
  requireEvidence: authority append / accepted candidate 必须有 evidence
  requireVerifier: authority append / accepted candidate 必须有 accepted verifier verdict
  minConfidence: authority append / verifier 接受的最低 confidence
  requireNoConflict: authority CSV 首列 key 冲突时必须拒绝自动写入
  requireSchemaValid: candidate row 必须匹配 authority CSV header
  requireBackup: authority append 前必须写 run-local backup
  requireDiff: authority append 前必须写 bounded diff
  maxAuthorityRowsPerRun: 单次自动 append 的最大行数
  askUserWhen: conflict、overwriteAuthority、deleteAuthority、schemaChange、changesProjectBaseline、externalSideEffect、destructiveAction 等必须问用户

reviewPacketEnvelope:
  packetKind: 固定为 rekit-review
  direction: feature-to-authority
  manifestPath: 生成 packet 时使用的 pack manifest 路径
  manifestVersion: 生成 packet 时使用的 pack version
  reviewRoot: packet 所在 review 目录（case 相对路径）
  isMutation: false 表示 packet 本身不是 authority 写入
  writesReviewArtifacts: true 表示命令会写 review artifact
  reviewRequired: true 表示主线合入前必须 review-first
  producer: 生成器，例如 rekit/plan-subagents 或 rekit/continue
